name: Build APK

on:
  #push:
  #  branches: [ "new" ]
  #  paths-ignore:
  #    - '.gitignore'
  #    - 'app/.gitignore'
  #    - '*.md'
  #    - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Leave empty or set secrets if you want signing
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      #- name: Set up JDK 11
      #  uses: actions/setup-java@v4
      #  with:
      #    distribution: 'corretto'
      #    java-version: '11'

      - name: ☕️ 安装 Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # - Optional: if you want to build release APK signed in CI,
      # you need to provide a valid KEYSTORE.JKS and secrets.
      # Otherwise, build will fallback to unsigned.
      - name: Build Debug and Release APKs
        run: ./gradlew clean assembleDebug  # assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      #- name: Upload Release APK
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: release-apk
      #    path: app/build/outputs/apk/release/*.apk
